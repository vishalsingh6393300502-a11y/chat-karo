<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Karo</title>
  <style>
    :root {
      --bg: #07111c;
      --panel: rgba(17, 26, 39, 0.94);
      --panel-strong: #0f1d2b;
      --panel-soft: #132330;
      --border: #2a3f5c;
      --text: #edf6ff;
      --muted: #9bb1d1;
      --primary: #73a8ff;
      --primary-strong: #4f7fe9;
      --success: #57d392;
      --danger: #ff6d7a;
      --shadow: 0 20px 40px rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #07111f, #0d1729 45%, #0f1d2c);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .auth-shell {
      width: min(560px, 100%);
      background: rgba(14, 23, 35, 0.94);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px 22px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .auth-header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 2.7rem);
      letter-spacing: 0.04em;
    }

    .auth-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .auth-form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input, select, button, textarea {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(8, 15, 24, 0.88);
      color: var(--text);
      padding: 12px 14px;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(115, 168, 255, 0.95);
      box-shadow: 0 0 0 3px rgba(115, 168, 255, 0.12);
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover { opacity: 0.9; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff7a7a, var(--danger));
      color: white;
    }

    .btn-success {
      background: linear-gradient(135deg, #7de7ae, var(--success));
      color: #0d1f18;
    }

    .btn-ghost {
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .app-shell {
      width: min(1100px, 100%);
      height: min(88vh, 820px);
      background: rgba(12, 20, 30, 0.88);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: rgba(9, 16, 25, 0.96);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #fff;
      font-weight: 800;
    }

    .brand-text {
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .brand-sub {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .presence {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .presence-pill {
      padding: 6px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
      box-shadow: 0 0 12px rgba(87, 211, 146, 0.9);
    }

    .chat-main {
      height: calc(100% - 80px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: rgba(11, 18, 27, 0.82);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 17, 25, 0.9);
      color: var(--muted);
      min-height: 52px;
    }

    #matchStatus {
      font-weight: 600;
      color: var(--text);
    }

    #typingStatus {
      font-size: 0.82rem;
      color: var(--primary);
      font-weight: 600;
      min-height: 1.2em;
    }

    .messages {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, rgba(15, 22, 33, 0.74), rgba(10, 17, 26, 0.82));
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.incoming { justify-content: flex-start; }
    .message-row.outgoing { justify-content: flex-end; }

    .bubble {
      max-width: 78%;
      border-radius: 16px;
      padding: 10px 12px;
      word-break: break-word;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }

    .message-row.incoming .bubble {
      background: #1a2a3e;
      border: 1px solid var(--border);
      color: var(--text);
      border-top-left-radius: 6px;
    }

    .message-row.outgoing .bubble {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      border-top-right-radius: 6px;
    }

    .bubble .sender {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 4px;
      opacity: 0.9;
    }

    .bubble .text {
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .photo-card {
      width: min(280px, 72%);
      background: rgba(20, 29, 40, 0.96);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }

    .photo-card img {
      width: 100%;
      border-radius: 10px;
      display: block;
      object-fit: cover;
      max-height: 320px;
    }

    .photo-meta {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 8px;
      padding: 0 4px 2px;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      background: rgba(10, 17, 25, 0.96);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }

    .hidden {
      display: none !important;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: var(--muted);
      text-align: center;
      padding: 20px;
      font-size: 0.95rem;
    }

    @media (max-width: 560px) {
      body { padding: 12px; }
      .auth-shell, .app-shell { border-radius: 18px; }
      .composer {
        flex-wrap: wrap;
      }
      #messageInput {
        width: 100%;
        order: 1;
      }
      .upload-btn, #sendBtn {
        order: 2;
      }
      .bubble { max-width: 85%; }
    }
  </style>
</head>
<body>
  <section id="loginScreen" class="screen active">
    <div class="auth-shell">
      <div class="auth-header">
        <h1>Chat Karo</h1>
        <p>Random chat with anyone</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="nameInput">Name</label>
          <input id="nameInput" name="name" maxlength="24" placeholder="Your name" required />
        </div>

        <div class="field">
          <label for="genderInput">Gender</label>
          <select id="genderInput" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <label class="check">
          <input type="checkbox" id="ageCheck" required />
          <span>I am 18+ and agree to continue.</span>
        </label>

        <button class="btn btn-primary" type="submit">Start Chatting</button>
      </form>
    </div>
  </section>

  <section id="chatScreen" class="screen">
    <div class="app-shell">
      <header>
        <div class="brand">
          <div class="brand-mark">C</div>
          <div>
            <div class="brand-text">Chat Karo</div>
            <span class="brand-sub">Live random chat</span>
          </div>
        </div>

        <div class="presence">
          <span class="presence-pill"><span class="status-dot"></span> Online: <strong id="onlineCount">0</strong></span>
        </div>
      </header>

      <div class="chat-main">
        <div class="status-bar">
          <span id="matchStatus">Searching for a match...</span>
          <span id="typingStatus"></span>
        </div>

        <div id="messages" class="messages">
          <div class="empty-state">Waiting for someone to connect...</div>
        </div>

        <div class="composer">
          <input id="messageInput" type="text" maxlength="500" placeholder="Type a message..." />
          <label class="upload-btn">
            <input id="photoInput" type="file" accept="image/*" hidden />
            Add Photo
          </label>
          <button id="sendBtn" class="btn btn-primary" type="button">Send</button>
        </div>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const loginScreen = document.getElementById('loginScreen');
    const chatScreen = document.getElementById('chatScreen');
    const loginForm = document.getElementById('loginForm');
    const nameInput = document.getElementById('nameInput');
    const genderInput = document.getElementById('genderInput');
    const messagesEl = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const photoInput = document.getElementById('photoInput');
    const matchStatus = document.getElementById('matchStatus');
    const typingStatus = document.getElementById('typingStatus');
    const onlineCount = document.getElementById('onlineCount');

    const state = {
      connected: false,
      partnerName: '',
      selectedPhoto: '',
      typingTimer: null
    };

    function setScreen(showChat) {
      loginScreen.classList.toggle('active', !showChat);
      chatScreen.classList.toggle('active', showChat);
    }

    function updateOnline(total) {
      onlineCount.textContent = total || 0;
    }

    function setStatus(text) {
      matchStatus.textContent = text;
    }

    function clearEmptyState() {
      const empty = messagesEl.querySelector('.empty-state');
      if (empty) empty.remove();
    }

    function appendMessage(name, message, direction) {
      clearEmptyState();
      const row = document.createElement('div');
      row.className = `message-row ${direction}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const sender = document.createElement('span');
      sender.className = 'sender';
      sender.textContent = name;

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = message;

      bubble.appendChild(sender);
      bubble.appendChild(text);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendPhoto(name, photo, direction) {
      clearEmptyState();
      const row = document.createElement('div');
      row.className = `message-row ${direction}`;

      const card = document.createElement('div');
      card.className = 'photo-card';

      const img = document.createElement('img');
      img.src = photo;
      img.alt = 'Sent photo';

      const meta = document.createElement('span');
      meta.className = 'photo-meta';
      meta.textContent = name;

      card.appendChild(img);
      card.appendChild(meta);
      row.appendChild(card);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTypingIndicator(text) {
      typingStatus.textContent = text;
    }

    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxSize = 700;
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            let quality = 0.82;
            let dataUrl = canvas.toDataURL('image/jpeg', quality);
            const maxBytes = 70 * 1024;

            while (dataUrl.length > maxBytes * 1.4 && quality > 0.35) {
              quality -= 0.08;
              dataUrl = canvas.toDataURL('image/jpeg', quality);
            }

            resolve(dataUrl);
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function handlePhotoSelection(file) {
      if (!file) return;
      resizeImage(file)
        .then((compressed) => {
          state.selectedPhoto = compressed;
          const preview = document.createElement('div');
          preview.className = 'photo-card';
          preview.innerHTML = `<img src="${compressed}" alt="Selected preview" /><span class="photo-meta">Photo ready to send</span>`;

          const existing = messagesEl.querySelector('.preview-box');
          if (existing) existing.remove();
          preview.classList.add('preview-box');
          messagesEl.appendChild(preview);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        })
        .catch(() => {
          setStatus('Photo could not be processed. Please try another image.');
        });
    }

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      const gender = genderInput.value;

      if (!name) {
        setStatus('Please enter your name.');
        return;
      }

      socket.emit('startSearch', { name, gender });
      setScreen(true);
      setStatus('Searching for a match...');
      showTypingIndicator('');
      state.connected = false;
      state.partnerName = '';
    });

    sendBtn.addEventListener('click', () => {
      const message = messageInput.value.trim();

      if (state.selectedPhoto) {
        socket.emit('sendPhoto', state.selectedPhoto);
        appendPhoto('You', state.selectedPhoto, 'outgoing');
        state.selectedPhoto = '';
        const preview = messagesEl.querySelector('.preview-box');
        if (preview) preview.remove();
      }

      if (message) {
        socket.emit('sendMessage', message);
        appendMessage('You', message, 'outgoing');
        messageInput.value = '';
      }
    });

    messageInput.addEventListener('input', () => {
      if (!state.connected) return;
      socket.emit('typing');
      clearTimeout(state.typingTimer);
      state.typingTimer = setTimeout(() => socket.emit('stopTyping'), 800);
    });

    photoInput.addEventListener('change', (event) => {
      const [file] = event.target.files;
      if (!file) return;
      handlePhotoSelection(file);
      event.target.value = '';
    });

    socket.on('onlineStats', ({ total }) => {
      updateOnline(total || 0);
    });

    socket.on('presence', ({ total }) => {
      updateOnline(total || 0);
    });

    socket.on('searching', () => {
      setStatus('Searching for a match...');
    });

    socket.on('chatConnected', ({ partnerName, partnerGender }) => {
      state.connected = true;
      state.partnerName = partnerName;
      setStatus(`Connected with ${partnerName} (${partnerGender})`);
      showTypingIndicator('');
      clearEmptyState();
    });

    socket.on('receiveMessage', ({ name, message }) => {
      appendMessage(name, message, 'incoming');
    });

    socket.on('receivePhoto', ({ name, photo }) => {
      appendPhoto(name, photo, 'incoming');
    });

    socket.on('partnerTyping', (name) => {
      if (state.connected) showTypingIndicator(`${name} is typing...`);
    });

    socket.on('partnerStopTyping', () => {
      if (state.connected) showTypingIndicator('');
    });

    socket.on('partnerDisconnected', () => {
      state.connected = false;
      state.partnerName = '';
      setStatus('Partner left. Searching again...');
      showTypingIndicator('');
      socket.emit('startSearch', {
        name: nameInput.value.trim() || 'Anonymous',
        gender: genderInput.value
      });
    });

    socket.on('connect', () => {
      console.log('Connected to server');
    });
  </script>
</body>
</html>
