<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Karo — Random Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; color: #7b8cde; }
    header .subtitle { font-size: 0.65rem; color: #5b9cff; font-weight: 400; letter-spacing: 0.5px; }

    #onlineStats {
      display: flex;
      gap: 12px;
      font-size: 0.75rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #2a2a4a;
      border-radius: 4px;
    }
    .stat-label { color: #aaa; font-weight: 500; }
    .stat-count { color: #6bcb77; font-weight: 600; }
    .stat-male { color: #5b9cff; }
    .stat-female { color: #ff69b4; }
    .stat-other { color: #ffa500; }

    .screen { display: none; width: 100%; max-width: 640px; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }

    #landing {
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 24px;
    }
    #landing h2 { font-size: 1.6rem; color: #fff; text-align: center; }
    #landing p { color: #aaa; text-align: center; font-size: 0.9rem; }

    .form-group { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
    .form-group label { font-size: 0.85rem; color: #aaa; }
    .form-group input, .form-group select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #7b8cde; }

    .age-check { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #aaa; }
    .age-check input { width: 16px; height: 16px; cursor: pointer; }

    .btn {
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #7b8cde; color: #fff; }
    .btn-danger { background: #e05c5c; color: #fff; }
    .btn-success { background: #6bcb77; color: #111; }
    .btn-sm { padding: 7px 16px; font-size: 0.85rem; }

    #searching {
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top-color: #7b8cde;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #chat { padding: 0; }
    #chatHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      gap: 8px;
      flex-wrap: wrap;
    }
    #partnerInfo { font-size: 0.95rem; color: #ccc; }
    #partnerInfo span { color: #7b8cde; font-weight: 600; }
    .chat-actions { display: flex; gap: 8px; align-items: center; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.mine { align-self: flex-end; background: #7b8cde; color: #fff; border-bottom-right-radius: 3px; }
    .msg.theirs { align-self: flex-start; background: #2a2a3e; color: #e0e0e0; border-bottom-left-radius: 3px; }
    .msg.system { align-self: center; background: transparent; color: #888; font-size: 0.8rem; font-style: italic; }
    .msg .sender { font-size: 0.75rem; opacity: 0.7; margin-bottom: 3px; }

    .msg.photo-mine { max-width: auto; padding: 0; background: transparent; }
    .msg.photo-theirs { max-width: auto; padding: 0; background: transparent; }
    .photo-content {
      max-width: 200px;
      border-radius: 12px;
      overflow: hidden;
    }
    .photo-content img {
      width: 100%;
      height: auto;
      display: block;
    }

    #typingIndicator { padding: 4px 16px; font-size: 0.8rem; color: #888; min-height: 22px; }

    #inputArea {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
    }
    #msgInput {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      resize: none;
    }
    #msgInput:focus { border-color: #7b8cde; }

    #fileInput, #cameraInput { display: none; }

    .photo-menu {
      position: absolute;
      right: 8px;
      top: 56px;
      background: #111;
      border: 1px solid #2a2a4a;
      padding: 8px;
      border-radius: 8px;
      display: none;
      z-index: 120;
    }
    .photo-menu.open { display: block; }

    @media (max-width: 480px) {
      header h1 { font-size: 1rem; }
      #onlineStats { font-size: 0.7rem; gap: 8px; }
      .stat-item { padding: 3px 6px; }
      .msg { max-width: 88%; }
      .photo-content { max-width: 150px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🔵 Chat Karo</h1>
      <span class="subtitle">made by vishal</span>
    </div>
    <div id="onlineStats">
      <div class="stat-item">
        <span class="stat-label">👥 Total:</span>
        <span class="stat-count" id="totalOnline">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label stat-male">♂ Male:</span>
        <span class="stat-count stat-male" id="maleOnline">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label stat-female">♀ Female:</span>
        <span class="stat-count stat-female" id="femaleOnline">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label stat-other">⚬ Other:</span>
        <span class="stat-count stat-other" id="otherOnline">0</span>
      </div>
    </div>
  </header>

  <div id="photoMenu" class="photo-menu" aria-hidden="true">
    <button class="btn btn-sm" onclick="openCameraCapture()">📸 Camera</button>
    <button class="btn btn-sm" onclick="triggerGalleryUpload()">🖼️ Gallery</button>
  </div>

  <div id="landing" class="screen active">
    <h2>Meet Strangers, Chat Freely</h2>
    <p>Connect with random people instantly. No sign-up needed.</p>

    <div class="form-group">
      <label for="nameInput">Your Name</label>
      <input id="nameInput" type="text" placeholder="Enter your name" maxlength="30" />
    </div>

    <div class="form-group">
      <label for="genderSelect">Your Gender</label>
      <select id="genderSelect">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>

    <label class="age-check">
      <input type="checkbox" id="ageCheck" />
      I confirm I am 18 years or older
    </label>

    <button class="btn btn-primary" onclick="startSearch()">Start Chatting →</button>
  </div>

  <div id="searching" class="screen">
    <div class="spinner"></div>
    <p>Looking for someone to chat with…</p>
    <button class="btn btn-danger btn-sm" onclick="cancelSearch()">Cancel</button>
  </div>

  <div id="chat" class="screen">
    <div id="chatHeader">
      <div id="partnerInfo">Chatting with <span id="partnerName">—</span></div>
      <div class="chat-actions">
        <button class="btn btn-sm" style="background:#2a2a4a;color:#ccc" onclick="togglePhotoMenu(event)">📷</button>
        <button class="btn btn-success btn-sm" onclick="newChat()">Next →</button>
      </div>
    </div>

    <div id="messages"></div>
    <div id="typingIndicator"></div>

    <div id="inputArea">
      <textarea id="msgInput" rows="1" placeholder="Type a message…" maxlength="500"></textarea>
      <button class="btn btn-primary" onclick="sendMessage()">Send</button>
      <input type="file" id="fileInput" accept="image/*" />
      <input type="file" id="cameraInput" accept="image/*" capture="environment" />
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function addMessage(text, type = 'system', sender = '', isPhoto = false) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');

      if (isPhoto) {
        div.className = `msg photo-${type}`;
        const photoDiv = document.createElement('div');
        photoDiv.className = 'photo-content';
        const img = document.createElement('img');
        img.src = text;
        img.style.cursor = 'pointer';
        img.onclick = () => { window.open(text, '_blank'); };
        photoDiv.appendChild(img);
        div.appendChild(photoDiv);
      } else {
        div.className = `msg ${type}`;
        if (sender) {
          const s = document.createElement('div');
          s.className = 'sender';
          s.textContent = sender;
          div.appendChild(s);
        }
        div.appendChild(document.createTextNode(text));
      }

      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function clearMessages() {
      document.getElementById('messages').innerHTML = '';
      document.getElementById('typingIndicator').textContent = '';
    }

    function startSearch() {
      const name = document.getElementById('nameInput').value.trim();
      const gender = document.getElementById('genderSelect').value;
      const ageOk = document.getElementById('ageCheck').checked;

      if (!name) { alert('Please enter your name.'); return; }
      if (!ageOk) { alert('You must confirm you are 18+ to continue.'); return; }

      showScreen('searching');
      socket.emit('startSearch', { name, gender });
    }

    function cancelSearch() {
      socket.emit('newChat');
      showScreen('landing');
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const msg = input.value.trim();
      if (!msg) return;

      socket.emit('sendMessage', msg);
      addMessage(msg, 'mine');
      input.value = '';
      socket.emit('stopTyping');
    }

    function newChat() {
      clearMessages();
      socket.emit('newChat');
      showScreen('searching');
    }

    function togglePhotoMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('photoMenu');
      menu.classList.toggle('open');
      menu.setAttribute('aria-hidden', menu.classList.contains('open') ? 'false' : 'true');
    }
    document.body.addEventListener('click', () => {
      const menu = document.getElementById('photoMenu');
      menu.classList.remove('open');
      menu.setAttribute('aria-hidden', 'true');
    });

    function triggerGalleryUpload() {
      const fileInput = document.getElementById('fileInput');
      if (fileInput) fileInput.click();
    }

    let cameraStream;
    async function openCameraCapture() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
          const video = document.createElement('video');
          video.srcObject = cameraStream;
          video.autoplay = true;
          video.playsInline = true;
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          video.onloadedmetadata = () => {
            canvas.width = video.videoWidth || 1024;
            canvas.height = video.videoHeight || 768;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(async (blob) => {
              if (blob) {
                const file = new File([blob], 'capture.jpg', { type: blob.type });
                await processAndSendPhoto(file);
              }
              cameraStream.getTracks().forEach((track) => track.stop());
              cameraStream = null;
            }, 'image/jpeg', 0.9);
          };
          return;
        } catch (err) {
          // fallback to camera input
        }
      }

      const cameraInput = document.getElementById('cameraInput');
      if (cameraInput) cameraInput.click();
    }

    async function processAndSendPhoto(file) {
      if (!file) return;
      const dataUrl = await compressImageFile(file, 1024, 0.7);
      if (!dataUrl) { alert('Failed to process image'); return; }

      socket.emit('sendPhoto', dataUrl);
      addMessage(dataUrl, 'mine', '', true);
    }

    function compressImageFile(file, maxDim = 1024, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxDim) {
              height = Math.round(height * (maxDim / width));
              width = maxDim;
            } else if (height > width && height > maxDim) {
              width = Math.round(width * (maxDim / height));
              height = maxDim;
            } else if (width > maxDim) {
              width = maxDim;
              height = Math.round(height * (maxDim / width));
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(null);
          img.src = ev.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await processAndSendPhoto(file);
      e.target.value = '';
    });

    document.getElementById('cameraInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await processAndSendPhoto(file);
      e.target.value = '';
    });

    let typingTimer;
    document.getElementById('msgInput').addEventListener('input', () => {
      socket.emit('typing');
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => socket.emit('stopTyping'), 1500);
    });

    document.getElementById('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    socket.on('onlineStats', (stats) => {
      document.getElementById('totalOnline').textContent = stats.total;
      document.getElementById('maleOnline').textContent = stats.male;
      document.getElementById('femaleOnline').textContent = stats.female;
      document.getElementById('otherOnline').textContent = stats.other;
    });

    socket.on('searching', () => { showScreen('searching'); });

    socket.on('chatConnected', ({ partnerName }) => {
      clearMessages();
      document.getElementById('partnerName').textContent = partnerName;
      showScreen('chat');
      addMessage(`Connected with ${partnerName}. Say hi! 👋`, 'system');
    });

    socket.on('receiveMessage', ({ name, message }) => {
      addMessage(message, 'theirs', name);
    });

    socket.on('partnerTyping', (name) => {
      document.getElementById('typingIndicator').textContent = `${name} is typing…`;
    });

    socket.on('partnerStopTyping', () => {
      document.getElementById('typingIndicator').textContent = '';
    });

    socket.on('photoRequested', (name) => {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg system';

      const txt = document.createElement('div');
      txt.textContent = `${name} requested a photo.`;
      div.appendChild(txt);

      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = 'Choose file';
      btn.style.marginTop = '8px';
      btn.onclick = () => {
        const fileInput = document.getElementById('fileInput');
        if (fileInput) fileInput.click();
      };
      div.appendChild(btn);

      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    });

    socket.on('receivePhoto', ({ name, photo }) => {
      addMessage(photo, 'theirs', `${name} sent a photo`, true);
    });

    socket.on('partnerDisconnected', () => {
      addMessage('Partner disconnected. Click "Next →" to find someone new.', 'system');
      document.getElementById('typingIndicator').textContent = '';
    });
  </script>
</body>
</html>
