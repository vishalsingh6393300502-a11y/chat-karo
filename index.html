<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Karo — Random Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; color: #7b8cde; }
    header .subtitle { font-size: 0.65rem; color: #5b9cff; font-weight: 400; letter-spacing: 0.5px; }
    
    #onlineStats {
      display: flex;
      gap: 12px;
      font-size: 0.75rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #2a2a4a;
      border-radius: 4px;
    }
    .stat-label { color: #aaa; font-weight: 500; }
    .stat-count { color: #6bcb77; font-weight: 600; }
    .stat-male { color: #5b9cff; }
    .stat-female { color: #ff69b4; }
    .stat-other { color: #ffa500; }

    /* ── Photo / modal / call UI */
    .photo-menu {
      position: absolute;
      right: 18px;
      top: 56px;
      background: #12121a;
      border: 1px solid #2a2a4a;
      padding: 8px;
      border-radius: 8px;
      display: none;
      z-index: 60;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    .photo-menu.open { display: block; }
    .photo-menu button { display:block; width:100%; margin:6px 0; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); z-index: 80;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: #1e1e2e; padding: 12px; border-radius: 10px; max-width: 420px; width: 92%;
    }

    .call-bar { display:flex; gap:8px; align-items:center; }
    .call-status { color:#9fb3ff; font-weight:600; }

    /* ── Screens ── */
    .screen { display: none; width: 100%; max-width: 640px; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }

    /* ── Landing ── */
    #landing {
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 24px;
    }
    #landing h2 { font-size: 1.6rem; color: #fff; text-align: center; }
    #landing p  { color: #aaa; text-align: center; font-size: 0.9rem; }

    .form-group { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
    .form-group label { font-size: 0.85rem; color: #aaa; }
    .form-group input, .form-group select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #7b8cde; }

    .age-check { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #aaa; }
    .age-check input { width: 16px; height: 16px; cursor: pointer; }

    .btn {
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #7b8cde; color: #fff; }
    .btn-danger  { background: #e05c5c; color: #fff; }
    .btn-success { background: #6bcb77; color: #111; }
    .btn-sm { padding: 7px 16px; font-size: 0.85rem; }

    /* ── Searching ── */
    #searching {
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #333;
      border-top-color: #7b8cde;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Chat ── */
    #chat { padding: 0; }
    #chatHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      gap: 8px;
      flex-wrap: wrap;
    }
    #partnerInfo { font-size: 0.95rem; color: #ccc; }
    #partnerInfo span { color: #7b8cde; font-weight: 600; }
    .chat-actions { display: flex; gap: 8px; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.mine    { align-self: flex-end; background: #7b8cde; color: #fff; border-bottom-right-radius: 3px; }
    .msg.theirs  { align-self: flex-start; background: #2a2a3e; color: #e0e0e0; border-bottom-left-radius: 3px; }
    .msg.system  { align-self: center; background: transparent; color: #888; font-size: 0.8rem; font-style: italic; }
    .msg .sender { font-size: 0.75rem; opacity: 0.7; margin-bottom: 3px; }
    
    /* Photo message styling */
    .msg.photo-mine { max-width: auto; padding: 0; background: transparent; }
    .msg.photo-theirs { max-width: auto; padding: 0; background: transparent; }
    .photo-content {
      max-width: 200px;
      border-radius: 12px;
      overflow: hidden;
    }
    .photo-content img {
      width: 100%;
      height: auto;
      display: block;
    }

    #typingIndicator { padding: 4px 16px; font-size: 0.8rem; color: #888; min-height: 22px; }

    #inputArea {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
    }
    #msgInput {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      resize: none;
    }
    #msgInput:focus { border-color: #7b8cde; }
    
    #fileInput, #cameraInput { display: none; }

    /* ── Report modal ── */
    #reportModal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #reportModal.open { display: flex; }
    .modal-box {
      background: #1e1e2e;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-box h3 { color: #e05c5c; }
    .modal-box select {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: #e0e0e0;
      font-size: 0.95rem;
    }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    @media (max-width: 480px) {
      header h1 { font-size: 1rem; }
      #onlineStats { font-size: 0.7rem; gap: 8px; }
      .stat-item { padding: 3px 6px; }
      .msg { max-width: 88%; }
      .photo-content { max-width: 150px; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🔵 Chat Karo</h1>
    <span class="subtitle">made by vishal</span>
  </div>
  <div style="position:relative">
    <div id="onlineStats">
      <div class="stat-item">
        <span class="stat-label">👥 Total:</span>
        <span class="stat-count" id="totalOnline">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label stat-male">♂ Male:</span>
        <span class="stat-count stat-male" id="maleOnline">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label stat-female">♀ Female:</span>
        <span class="stat-count stat-female" id="femaleOnline">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label stat-other">⚬ Other:</span>
        <span class="stat-count stat-other" id="otherOnline">0</span>
      </div>
    </div>
  </div>
</header>

<!-- Photo menu (opened from chat header) -->
<div id="photoMenu" class="photo-menu" aria-hidden="true">
  <button class="btn btn-sm" onclick="openCameraCapture()">📸 Camera</button>
  <button class="btn btn-sm" onclick="triggerGalleryUpload()">🖼️ Gallery</button>
</div>

<!-- Camera modal for desktop capture -->
<div id="cameraModal" class="modal-overlay" aria-hidden="true">
  <div class="modal-card">
    <h3>Take a photo</h3>
    <video id="cameraVideo" autoplay playsinline style="width:100%;border-radius:8px;background:#000"></video>
    <div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end">
      <button class="btn btn-sm" onclick="closeCameraCapture()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="captureFromCamera()">Capture</button>
    </div>
  </div>
</div>

<!-- Call modal -->
<div id="callModal" class="modal-overlay" aria-hidden="true">
  <div class="modal-card" id="callCard">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-weight:700;color:#fff" id="incomingCaller">Incoming call</div>
        <div style="color:#aac;font-size:0.9rem" id="incomingInfo">Someone is calling you</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-danger btn-sm" onclick="declineCall()">Decline</button>
        <button class="btn btn-success btn-sm" onclick="acceptCall()">Accept</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Landing Screen ── -->
<div id="landing" class="screen active">
  <h2>Meet Strangers, Chat Freely</h2>
  <p>Connect with random people instantly. No sign-up needed.</p>

  <div class="form-group">
    <label for="nameInput">Your Name</label>
    <input id="nameInput" type="text" placeholder="Enter your name" maxlength="30" />
  </div>

  <div class="form-group">
    <label for="genderSelect">Your Gender</label>
    <select id="genderSelect">
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select>
  </div>

  <label class="age-check">
    <input type="checkbox" id="ageCheck" />
    I confirm I am 18 years or older
  </label>

  <button class="btn btn-primary" onclick="startSearch()">Start Chatting →</button>
</div>

<!-- ── Searching Screen ── -->
<div id="searching" class="screen">
  <div class="spinner"></div>
  <p>Looking for someone to chat with…</p>
  <button class="btn btn-danger btn-sm" onclick="cancelSearch()">Cancel</button>
</div>

<!-- ── Chat Screen ── -->
<div id="chat" class="screen">
  <div id="chatHeader">
    <div id="partnerInfo">Chatting with <span id="partnerName">—</span></div>
    <div class="chat-actions">
      <button id="photoBtn" class="btn btn-sm" style="background:#2a2a4a;color:#ccc" onclick="togglePhotoMenu(event)">📷 Photo</button>
      <button class="btn btn-sm" id="callBtn" title="Call" style="background:#2a2a4a;color:#cfe" onclick="triggerCall()">📞</button>
      <button class="btn btn-danger btn-sm" onclick="openReport()">🚩 Report</button>
      <button class="btn btn-success btn-sm" onclick="newChat()">Next →</button>
    </div>
  </div>

  <div id="messages"></div>
  <div id="typingIndicator"></div>

  <!-- audio element for incoming remote audio -->
  <audio id="remoteAudio" autoplay></audio>

  <div id="inputArea">
    <textarea id="msgInput" rows="1" placeholder="Type a message…" maxlength="500"></textarea>
    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    <input type="file" id="fileInput" accept="image/*" />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" />
  </div>
</div>

<!-- ── Report Modal ── -->
<div id="reportModal">
  <div class="modal-box">
    <h3>🚩 Report User</h3>
    <select id="reportReason">
      <option value="spam">Spam</option>
      <option value="harassment">Harassment</option>
      <option value="inappropriate">Inappropriate content</option>
      <option value="underage">Suspected underage</option>
      <option value="other">Other</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-sm" style="background:#333;color:#ccc" onclick="closeReport()">Cancel</button>
      <button class="btn btn-danger btn-sm" onclick="submitReport()">Submit Report</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Ringtone (WebAudio) - gentle plucked tone loop
  let audioCtx, ringtoneOsc, ringtoneGain, ringtoneInterval;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  function playRingtone() {
    ensureAudio();
    stopRingtone();
    ringtoneGain = audioCtx.createGain();
    ringtoneGain.gain.value = 0.03; // low, pleasant
    ringtoneGain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    // create two quick tones to form a simple pleasant ring
    ringtoneOsc = audioCtx.createOscillator();
    ringtoneOsc.type = 'sine';
    ringtoneOsc.frequency.value = 420;
    ringtoneOsc.connect(ringtoneGain);
    ringtoneOsc.start(now);
    // stop after 1.2s, then restart every 2s while ringing
    ringtoneOsc.stop(now + 1.2);

    ringtoneInterval = setInterval(() => {
      if (ringtoneOsc) try{ ringtoneOsc.disconnect(); }catch(e){}
      ringtoneOsc = audioCtx.createOscillator();
      ringtoneOsc.type = 'sine';
      ringtoneOsc.frequency.value = 420;
      ringtoneOsc.connect(ringtoneGain);
      ringtoneOsc.start();
      setTimeout(()=>{ try{ ringtoneOsc.stop(); }catch(e){} }, 1200);
    }, 2000);
  }
  function stopRingtone() {
    try { if (ringtoneOsc) ringtoneOsc.stop(); } catch(e){}
    try { if (ringtoneOsc) ringtoneOsc.disconnect(); } catch(e){}
    if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
    ringtoneOsc = null;
    if (ringtoneGain) { try{ ringtoneGain.disconnect(); }catch(e){} ringtoneGain = null; }
  }

  // ── UI helpers ──────────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function addMessage(text, type = 'system', sender = '', isPhoto = false) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    
    if (isPhoto) {
      div.className = `msg photo-${type}`;
      const photoDiv = document.createElement('div');
      photoDiv.className = 'photo-content';
      const img = document.createElement('img');
      img.src = text; // text contains the data URL
      photoDiv.appendChild(img);
      div.appendChild(photoDiv);
    } else {
      div.className = `msg ${type}`;
      if (sender) {
        const s = document.createElement('div');
        s.className = 'sender';
        s.textContent = sender;
        div.appendChild(s);
      }
      div.appendChild(document.createTextNode(text));
    }
    
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function clearMessages() {
    document.getElementById('messages').innerHTML = '';
    document.getElementById('typingIndicator').textContent = '';
  }

  // ── Actions ─────────────────────────────────────────────────
  function startSearch() {
    const name = document.getElementById('nameInput').value.trim();
    const gender = document.getElementById('genderSelect').value;
    const ageOk = document.getElementById('ageCheck').checked;

    if (!name) { alert('Please enter your name.'); return; }
    if (!ageOk) { alert('You must confirm you are 18+ to continue.'); return; }

    showScreen('searching');
    socket.emit('startSearch', { name, gender });
  }

  function cancelSearch() {
    socket.emit('newChat'); // clears queue server-side
    showScreen('landing');
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    const msg = input.value.trim();
    if (!msg) return;
    socket.emit('sendMessage', msg);
    addMessage(msg, 'mine');
    input.value = '';
    socket.emit('stopTyping');
  }

  function newChat() {
    clearMessages();
    socket.emit('newChat');
    showScreen('searching');
  }

  // Photo menu handling
  function togglePhotoMenu(e) {
    e.stopPropagation();
    const menu = document.getElementById('photoMenu');
    menu.classList.toggle('open');
    menu.setAttribute('aria-hidden', menu.classList.contains('open') ? 'false' : 'true');
  }
  document.body.addEventListener('click', () => {
    const menu = document.getElementById('photoMenu');
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden', 'true');
  });

  function triggerGalleryUpload() {
    const fileInput = document.getElementById('fileInput');
    if (fileInput) fileInput.click();
  }

  // Camera flow: prefer getUserMedia capture for desktop and fallback to cameraInput for mobile
  let cameraStream;
  async function openCameraCapture() {
    // Try navigator.mediaDevices first for a nicer experience on desktop
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        const video = document.getElementById('cameraVideo');
        video.srcObject = cameraStream;
        document.getElementById('cameraModal').classList.add('open');
        document.getElementById('cameraModal').setAttribute('aria-hidden', 'false');
        return;
      } catch (err) {
        // fallthrough to mobile input
      }
    }
    // fallback to mobile camera input if available
    const cameraInput = document.getElementById('cameraInput');
    if (cameraInput) cameraInput.click();
  }
  function closeCameraCapture() {
    document.getElementById('cameraModal').classList.remove('open');
    document.getElementById('cameraModal').setAttribute('aria-hidden', 'true');
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
  }
  function captureFromCamera() {
    const video = document.getElementById('cameraVideo');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(async (blob) => {
      closeCameraCapture();
      // process blob like a file
      const file = new File([blob], 'capture.jpg', { type: blob.type });
      await processAndSendPhoto(file);
    }, 'image/jpeg', 0.9);
  }

  // ── Photo Upload ─────────────────────────────────────────────
  async function processAndSendPhoto(file) {
    if (!file) return;
    // Validate file size (8MB max before compression)
    if (file.size > 8 * 1024 * 1024) {
      // still attempt to compress
    }

    const dataUrl = await compressImageFile(file, 1024, 0.75);
    if (!dataUrl) { alert('Failed to process image'); return; }

    // Send smaller base64 over socket
    socket.emit('sendPhoto', dataUrl);
    addMessage(dataUrl, 'mine', '', true);
  }

  function compressImageFile(file, maxDim = 1024, quality = 0.75) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (Math.max(width, height) > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          // improve rendering quality
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, width, height);
          // convert to JPEG to reduce size
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        };
        img.onerror = () => resolve(null);
        img.src = ev.target.result;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await processAndSendPhoto(file);
    e.target.value = '';
  });
  document.getElementById('cameraInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await processAndSendPhoto(file);
    e.target.value = '';
  });

  // ── Typing ─────────────────────────────────���────────────────
  let typingTimer;
  document.getElementById('msgInput').addEventListener('input', () => {
    socket.emit('typing');
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => socket.emit('stopTyping'), 1500);
  });

  document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Call (signaling + WebRTC) ─────────────────────────────────
  let currentCall = null; // {state: 'outgoing'|'incoming'|'active'}
  let outgoingTimeout = null;

  // WebRTC variables
  let localStream = null;
  let pc = null;
  const pcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  async function ensureLocalAudio() {
    if (localStream) return localStream;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      // keep local tracks running until call ends
      return localStream;
    } catch (e) {
      console.error('Failed to get microphone', e);
      alert('Microphone access is required for calls. Please allow microphone permission.');
      throw e;
    }
  }

  function createPeerConnection() {
    if (pc) return pc;
    pc = new RTCPeerConnection(pcConfig);

    pc.onicecandidate = (e) => {
      if (e.candidate) {
        socket.emit('webrtc-ice', e.candidate);
      }
    };

    const remoteAudioEl = document.getElementById('remoteAudio');
    const remoteStream = new MediaStream();
    remoteAudioEl.srcObject = remoteStream;

    pc.ontrack = (e) => {
      // add tracks to remote stream
      if (e.streams && e.streams[0]) {
        e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
      } else {
        e.track && remoteStream.addTrack(e.track);
      }
    };

    pc.onconnectionstatechange = () => {
      if (!pc) return;
      console.log('PC state', pc.connectionState);
      if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        endWebRTCCall();
      }
    };

    return pc;
  }

  async function startOutgoingWebRTCCall() {
    try {
      await ensureLocalAudio();
      createPeerConnection();
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('webrtc-offer', offer);
    } catch (e) {
      console.error('Failed to start outgoing WebRTC call', e);
      addMessage('Failed to start call: ' + (e.message || e), 'system');
      endWebRTCCall();
    }
  }

  async function handleIncomingOffer(offer) {
    try {
      await ensureLocalAudio();
      createPeerConnection();
      // add local tracks
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('webrtc-answer', answer);
    } catch (e) {
      console.error('Failed to handle incoming offer', e);
      addMessage('Call setup failed: ' + (e.message || e), 'system');
      endWebRTCCall();
    }
  }

  async function handleIncomingAnswer(answer) {
    try {
      if (!pc) return;
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
    } catch (e) {
      console.error('Failed to set remote description (answer)', e);
    }
  }

  async function handleIncomingIce(candidate) {
    try {
      if (!pc || !candidate) return;
      await pc.addIceCandidate(new RTCIceCandidate(candidate));
    } catch (e) {
      console.warn('Failed to add ICE candidate', e);
    }
  }

  function endWebRTCCall() {
    try {
      if (pc) {
        try { pc.getSenders().forEach(s => { if (s.track) s.track.stop(); }); } catch(e){}
        try { pc.close(); } catch(e){}
        pc = null;
      }
      if (localStream) {
        try { localStream.getTracks().forEach(t => t.stop()); } catch(e){}
        localStream = null;
      }
      const remoteAudioEl = document.getElementById('remoteAudio');
      try { remoteAudioEl.srcObject = null; } catch(e){}
    } catch (e) { console.error(e); }
  }

  function triggerCall() {
    // emit a call request; server should forward to partner
    socket.emit('callRequest');
    currentCall = { state: 'outgoing' };
    addMessage('Calling… 🎧', 'system');
    // play a short ring locally while outgoing
    playRingtone();
    // stop after 20s if no answer
    if (outgoingTimeout) clearTimeout(outgoingTimeout);
    outgoingTimeout = setTimeout(() => { if (currentCall && currentCall.state === 'outgoing') { stopRingtone(); addMessage('Call unanswered', 'system'); currentCall=null; endWebRTCCall(); } }, 20000);
  }

  socket.on('incomingCall', ({ from }) => {
    currentCall = { state: 'incoming', from };
    document.getElementById('incomingCaller').textContent = `${from} is calling`;
    document.getElementById('incomingInfo').textContent = 'Incoming call';
    document.getElementById('callModal').classList.add('open');
    document.getElementById('callModal').setAttribute('aria-hidden', 'false');
    playRingtone();
    // Vibrate the device on incoming call (short pleasant pattern)
    try { if (navigator.vibrate) navigator.vibrate([300,150,300]); } catch(e){}
  });

  async function acceptCall() {
    if (!currentCall) return;
    socket.emit('callResponse', { accept: true });
    document.getElementById('callModal').classList.remove('open');
    stopRingtone();
    currentCall.state = 'active';
    addMessage('Call started — setting up audio…', 'system');
    // Prepare to receive an offer from the caller; get mic ready so user can speak immediately
    try {
      await ensureLocalAudio();
      createPeerConnection();
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    } catch (e) {
      console.error('Error preparing call', e);
    }
  }
  function declineCall() {
    if (!currentCall) return;
    socket.emit('callResponse', { accept: false });
    document.getElementById('callModal').classList.remove('open');
    stopRingtone();
    addMessage('Call declined', 'system');
    currentCall = null;
  }

  socket.on('callAccepted', async () => {
    stopRingtone();
    addMessage('Call accepted — starting…', 'system');
    currentCall = { state: 'active' };
    // Caller should start WebRTC offer now
    await startOutgoingWebRTCCall();
  });
  socket.on('callDeclined', () => {
    stopRingtone();
    addMessage('Call declined by partner', 'system');
    currentCall = null;
    endWebRTCCall();
  });

  socket.on('callEnded', () => {
    addMessage('Call ended', 'system');
    currentCall = null;
    endWebRTCCall();
  });

  // WebRTC SDP/ICE relays
  socket.on('webrtc-offer', async (offer) => {
    // remote sent an offer — we're the callee
    await handleIncomingOffer(offer);
  });
  socket.on('webrtc-answer', async (answer) => {
    await handleIncomingAnswer(answer);
  });
  socket.on('webrtc-ice', async (candidate) => {
    await handleIncomingIce(candidate);
  });

  // ── Socket events ────────────────────────────────────────────
  socket.on('onlineStats', (stats) => {
    document.getElementById('totalOnline').textContent = stats.total;
    document.getElementById('maleOnline').textContent = stats.male;
    document.getElementById('femaleOnline').textContent = stats.female;
    document.getElementById('otherOnline').textContent = stats.other;
  });

  socket.on('searching', () => {
    showScreen('searching');
  });

  socket.on('chatConnected', ({ partnerName, partnerGender }) => {
    clearMessages();
    document.getElementById('partnerName').textContent = partnerName;
    showScreen('chat');
    addMessage(`Connected with ${partnerName}. Say hi! 👋`, 'system');
  });

  socket.on('receiveMessage', ({ name, message }) => {
    addMessage(message, 'theirs', name);
  });

  socket.on('partnerTyping', (name) => {
    document.getElementById('typingIndicator').textContent = `${name} is typing…`;
  });

  socket.on('partnerStopTyping', () => {
    document.getElementById('typingIndicator').textContent = '';
  });

  // When someone requests a photo, show a system message with a Choose file button
  socket.on('photoRequested', (name) => {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg system';

    const txt = document.createElement('div');
    txt.textContent = `${name} requested a photo.`;
    div.appendChild(txt);

    const btn = document.createElement('button');
    btn.className = 'btn btn-sm';
    btn.textContent = 'Choose file';
    btn.style.marginTop = '8px';
    btn.onclick = () => {
      const fileInput = document.getElementById('fileInput');
      if (fileInput) fileInput.click();
    };
    div.appendChild(btn);

    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  });

  socket.on('receivePhoto', ({ name, photo }) => {
    addMessage(photo, 'theirs', `${name} sent a photo`, true);
  });

  socket.on('partnerDisconnected', () => {
    addMessage('Partner disconnected. Click "Next →" to find someone new.', 'system');
    document.getElementById('typingIndicator').textContent = '';
    // clean up any active call state if partner dropped
    if (currentCall && currentCall.state === 'active') {
      endWebRTCCall();
      currentCall = null;
    }
  });
</script>
</body>
</html>
